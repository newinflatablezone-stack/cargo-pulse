<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="theme-color" content="#0c4337" />
  <title>Cargo Pulse | Shipment Tracking</title>
  <link rel="icon" type="image/png" sizes="96x96" href="./inflatable-zone-mark.png?v=2" />
  <link rel="apple-touch-icon" href="./inflatable-zone-mark.png?v=2" />
  <link rel="preload" as="image" href="./inflatable-zone-mark.png" fetchpriority="high" />
  <link rel="stylesheet" href="./style.css" />
  <link rel="stylesheet" href="./customer.css" />
</head>
<body>
  <main class="shell">
    <header class="brand" aria-label="Cargo Pulse">
      <a href="./" class="brand-link">
        <img class="brand-mark" src="./inflatable-zone-mark.png" width="42" height="42" fetchpriority="high" alt="" aria-hidden="true" />
        <span>Cargo Pulse</span>
      </a>
    </header>

    <section class="hero">
      <div class="hero-copy">
        <h1>Track Your Shipment</h1>
        <p>Enter your email to view shipment updates and estimated delivery.</p>
      </div>

      <div class="hero-search">
        <form id="track-form" class="lookup email-only" novalidate>
          <label>
            <span>Email Address</span>
            <input id="email" name="email" type="email" autocomplete="email" placeholder="name@example.com" required />
          </label>
          <button id="submit-button" type="submit">Track Shipment</button>
        </form>
        <p id="form-message" class="form-message" role="alert" aria-live="polite"></p>
      </div>
    </section>

    <section id="result" class="result" hidden aria-live="polite"></section>
  </main>

  <footer>Shipment information securely provided by Inflatable-Zone</footer>
  <script type="module" src="./app.js"></script>
</body>
</html>
