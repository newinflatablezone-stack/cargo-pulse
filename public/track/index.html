<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="theme-color" content="#0c4337" />
  <title>Inflatable Zone: Shipment Tracking</title>
  <link rel="icon" type="image/jpeg" sizes="1708x1708" href="./storefront-favicon.jpg?v=1" />
  <link rel="apple-touch-icon" href="./storefront-favicon.jpg?v=1" />
  <link rel="preconnect" href="https://www.inflatable-zone.com" />
  <link rel="stylesheet" href="./style.css" />
  <link rel="stylesheet" href="./customer.css?v=20260901-9" />
</head>
<body>
  <main class="shell">
    <header class="brand" aria-label="Inflatable-Zone">
      <a href="https://www.inflatable-zone.com/" class="brand-link" aria-label="Visit Inflatable-Zone">
        <img class="brand-logo" src="https://www.inflatable-zone.com/cdn/shop/files/logo_e30bb65c-0a3b-4a8c-9717-b9e366ab3f6b.png?v=1711699636&amp;width=360" width="180" fetchpriority="high" alt="Inflatable-Zone" />
      </a>
    </header>

    <section class="hero">
      <div class="hero-copy">
        <h1>Track Your Shipment</h1>
        <p>Enter your email to view shipment updates and estimated delivery.</p>
      </div>

      <div class="hero-search">
        <form id="track-form" class="lookup email-only" novalidate>
          <label>
            <span>Email Address</span>
            <input id="email" name="email" type="email" autocomplete="email" placeholder="name@example.com" required />
          </label>
          <button id="submit-button" type="submit">Track Shipment</button>
        </form>
        <p id="form-message" class="form-message" role="alert" aria-live="polite"></p>
      </div>
    </section>

    <aside id="general-contact" class="general-contact" aria-labelledby="contact-heading">
      <div>
        <h2 id="contact-heading">Questions about your shipment?</h2>
        <p>We’re here to help. Contact our team for assistance.</p>
      </div>
      <div class="general-contact-details">
        <a href="tel:+16263427272"><span>Tel &amp; WhatsApp</span><strong>+1 (626) 342-7272</strong></a>
        <a href="mailto:sales@inflatable-zone.com"><span>Email</span><strong>sales@inflatable-zone.com</strong></a>
      </div>
    </aside>

    <section id="result" class="result" hidden aria-live="polite"></section>
  </main>

  <footer>Shipment information securely provided by Inflatable-Zone</footer>
  <script type="module" src="./app.js?v=20260901-4"></script>
</body>
</html>
